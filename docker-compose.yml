services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://monitor:monitor@db:5432/monitor
      SECRET_KEY: change-this-to-a-long-random-string
      ENCRYPTION_KEY: REPLACE_WITH_FERNET_KEY
      ALLOW_SIGNUP: "true"
      COOKIE_SECURE: "false"
      MIN_INTERVAL_SECONDS: "60"
    depends_on:
      - db
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: monitor
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: monitor
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
volumes:
  pgdata:
